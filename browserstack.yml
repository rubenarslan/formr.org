# browserstack-node-sdk config for the BS Automate variant of the e2e
# suite. Wired by `npm run test:bs` (=
# `browserstack-node-sdk playwright test --config tests/e2e/playwright.config.js`).
# The SDK monkey-patches Playwright at runtime to accept the real-device
# platforms below, then appends one project per platform to the config
# (see playwright.config.js header for the version pin caveat).
#
# Conventions adopted from feature/form_v2's browserstack.yml — they
# survived a round of debugging on real devices we don't want to repeat:
#   - `browserName: safari` (NOT `playwright-webkit`). The SDK accepts
#     'safari' and translates it; plain Playwright rejects with
#     "expected one of (chromium|firefox|webkit)".
#   - Empty `userName`/`accessKey` literals — that signals the SDK to
#     read BROWSERSTACK_USERNAME / BROWSERSTACK_ACCESS_KEY from env.
#     Inline secrets here would commit them to the repo. The
#     `npm run test:bs` script sources ../.env.dev before exec.
#   - `testReporting: false`. The SDK's testHub observability layer
#     mis-serializes Playwright errors on long-running iOS Safari tests
#     ("Serialized error must have either an error or a value"); turning
#     it off still leaves Automate dashboard sessions + videos.

userName: ''
accessKey: ''

projectName: formr v2 parity smoke
buildName: formr v2 parity smoke
buildIdentifier: '#${DATE_TIME}'

# Real-device matrix. Keep tight: each platform burns one parallel slot per
# test, and the open-source plan we have only allots 5.
#
# iOS Safari for the WebKit-only PWA install / IndexedDB / SW edge cases
# (also covers the pwa-reload-fix regression).
#
# Pixel 8 / Android Chrome was tried with `channel: 'chrome'` set
# conditionally on RUNNING_ON_BS in playwright.config.js (matches the
# BS Android sample at
# https://www.browserstack.com/docs/automate/playwright/playwright-android/nodejs)
# AND a bump of browserstack-node-sdk to 1.53.2. Browser-context tests
# still fail with `browserType.connect: Malformed endpoint` from the
# SDK's mock-process — only `request`-fixture (HTTP-only) tests pass.
# The BS docs note Playwright 1.57 migrated tests from Chromium to
# Chrome-for-Testing, which may be what's incompatible with the BS
# Android wsEndpoint transport. Re-add this platform when either:
#   (a) we bump @playwright/test to a version BS confirms works for
#       Android Chrome (or pin DOWN to 1.56.1 if upstream doesn't fix
#       1.58/1.59), or
#   (b) BS support resolves the malformed endpoint issue at SDK level.
# Until then the Android offline-queue smoke stays on local-Chromium
# + manual / live-session real-device verification.
platforms:
  - browserName: safari
    osVersion: 17
    deviceName: iPhone 15 Pro Max

parallelsPerPlatform: 1

# study.researchmixtape.com is publicly reachable so we don't need a
# BrowserStack Local tunnel. Flip to true if a future build runs against
# localhost.
browserstackLocal: false

# Debugging hooks — useful for the first few BS runs where we're still
# tuning. networkLogs adds noticeable session weight; trim to false once
# the suite stabilises.
debug: false
networkLogs: true
consoleLogs: errors

testReporting: false
